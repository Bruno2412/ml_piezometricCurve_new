[project]
name = "expert-piezometrie-pro"
version = "0.1.0"
description = "Expert Piézométrie Pro — Digital Twin (analyse et prévision piézométrique)"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.63.0",
    "pandas==3.0.2",
    "numpy==2.1.3",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "scikit-learn==1.8.0",
    "matplotlib==3.9.3",
    "folium==0.18.0",
    "streamlit-folium==0.23.1",
    "openpyxl==3.1.5",
    "xgboost==2.1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
