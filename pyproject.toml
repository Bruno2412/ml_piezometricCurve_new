[project]
name = "expert-piezometrie-pro"
version = "0.1.0"
description = "Expert Piézométrie Pro — Digital Twin (analyse et prévision piézométrique)"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.60.0",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.3",
    "folium==0.18.0",
    "streamlit-folium==0.23.1",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
