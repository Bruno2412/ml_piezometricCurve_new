[project]
name = "expert-piezometrie-pro"
version = "0.1.0"
description = "Expert Piézométrie Pro — Digital Twin (analyse et prévision piézométrique)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit==1.63.0",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "folium==0.20.0",
    "streamlit-folium==0.27.4",
    "openpyxl==3.1.5",
    "xgboost-cpu==2.1.3",
    "firebase-admin==6.6.0",
    "requests==2.34.2",
    "python-docx==1.2.0",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
]



[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.4.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/generate_requirements.py"]


[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",  # lignes longues : beaucoup de docstrings/commentaires en
             # français dépassent 100 caractères, pas une priorité à
             # corriger tout de suite sur un repo existant
    "N803",  # arguments en majuscule (Q, S, K, T...) : notation physique
             # standard en hydrogéologie, pas un problème de style
    "N806",  # idem pour les variables locales (GLon, GLat, GZ, R, T...)
]


[tool.ruff.lint.per-file-ignores]
# tab_admin.py importe streamlit/auth après son docstring de module,
# volontairement ordonné ainsi pour la lisibilité : pas une priorité
# à corriger sur un repo existant.
"src/piezo_app/components/tab_admin.py" = ["E402"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
